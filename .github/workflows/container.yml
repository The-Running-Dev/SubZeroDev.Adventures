name: Container

# Builds, smoke-tests and publishes the API and frontend images to GHCR through the shared
# container workflow. Pull requests build and smoke-test both images and push nothing.
#
# Deploys go through the Infra repository's deploy workflow (D38). The Portainer credentials live only
# there; this repository holds INFRA_DISPATCH_TOKEN (production environment), which can start that
# workflow and nothing else. deploy/ (OpenTofu) writes the token and the stack's configuration. The
# deployed image is the API, pinned by digest; its /readyz reports the commit, which the deploy waits for.
# The frontend rides :latest and is pulled by the same redeploy.
#
# The checks to require are `api / Result` and `web / Result`.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  api:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/container.yml@v1
    with:
      image-name: adventures-api
      dockerfile: server/Dockerfile
      context: .
      # The Dockerfile's last stage, named explicitly so that adding a stage after it
      # cannot silently change what gets published.
      target: runtime
      submodules: true
      build-args: |
        ADVENTURES_BUILD_REVISION=${{ github.sha }}
      tags: sha latest
      # The server cannot start without a Postgres, so the smoke test keeps the container
      # alive with a stand-in serve command and checks the image from inside.
      smoke-env: |
        ADVENTURES_SERVE_CMD=sleep infinity
      smoke-exec: scripts/smoke-api-image.sh

  web:
    # The deploy runs from this job, so it must start after the API image is pushed.
    needs: api
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/container.yml@v1
    with:
      image-name: adventures-web
      dockerfile: frontend/Dockerfile
      context: .
      target: runtime
      submodules: true
      build-args: |
        ADVENTURES_BUILD_REVISION=${{ github.sha }}
        VITE_ENABLE_PWA=${{ vars.FRONTEND_HOST == 'vps' }}
        VITE_API_URL=https://adventures-api.subzerodev.com
        VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
      tags: sha latest
      # The Dockerfile's HEALTHCHECK on /__build-id gates readiness; the script then checks
      # routing, assets and the revision against the running container.
      smoke-port: "8080"
      smoke-path: /__build-id
      # The restrictions the deployment stack applies, so the smoke test exercises what runs.
      smoke-options: |
        --read-only
        --tmpfs=/var/run:rw,mode=1777
        --tmpfs=/var/cache/nginx:rw,mode=1777
        --cap-drop=ALL
        --security-opt=no-new-privileges:true
      smoke-scripts: scripts/test-frontend-container.mjs
      node-version: "24"

  deploy:
    name: Deploy
    needs: [api, web]
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true' && needs.api.outputs.pushed == 'true' && needs.web.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    steps:
      - uses: The-Running-Dev/GitHub-ActionTemplates/actions/infra-deploy@c71f9720badd37b94b96da0c77633acc3a113647 # v2.2.0
        with:
          app: adventures
          digest: ${{ needs.api.outputs.digest }}
          token: ${{ secrets.INFRA_DISPATCH_TOKEN }}
