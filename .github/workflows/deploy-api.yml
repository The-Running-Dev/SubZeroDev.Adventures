name: Deploy API

# Builds and publishes the API container to GHCR on every push to main, then (if the VPS
# secrets below are configured) pulls and restarts it over SSH. The image build/push half
# always runs; the deploy half is a no-op until DEPLOY_HOST is set, so this workflow is
# safe to merge before the VPS exists.
#
# Required repository secrets for the deploy half (none of these are set by this change --
# provisioning the VPS, the SSH key, and the database password is the operator's job):
#   DEPLOY_HOST      -- the VPS hostname or IP
#   DEPLOY_USER      -- SSH user
#   DEPLOY_SSH_KEY   -- private key with access to that user
#   DB_PASSWORD      -- forwarded to compose.prod.yml's ${DB_PASSWORD}
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET -- forwarded the same way, for the OAuth upgrade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ghcr.io/the-running-dev/adventures-api:${{ github.sha }}
            ghcr.io/the-running-dev/adventures-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        run: echo "image=ghcr.io/the-running-dev/adventures-api:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    # Skips cleanly, rather than failing, until the VPS secrets exist.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Copy compose files to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,compose.prod.yml,Caddyfile"
          target: "~/subzerodev-adventures"

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/subzerodev-adventures
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}"
            export GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}"
            docker compose -f docker-compose.yml -f compose.prod.yml pull
            docker compose -f docker-compose.yml -f compose.prod.yml up -d
            docker compose -f docker-compose.yml -f compose.prod.yml exec -T migrate npm run migrate up
