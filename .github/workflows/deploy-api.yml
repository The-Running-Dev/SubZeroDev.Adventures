name: Deploy API

# Builds and publishes the API container to GHCR on every push to main, then (if
# PORTAINER_REDEPLOY_WEBHOOK_URL is configured) triggers a Portainer stack webhook to
# redeploy it -- the same mechanism SubZeroDev.com uses. The image build/push half always
# runs; the deploy half is a no-op until DEPLOY_ENABLED is set, so this workflow is safe to
# merge before the Portainer stack exists.
#
# This repo does not manage the VPS or SSH into it. The Portainer stack (pointed at this
# repo's root docker-compose.yml) owns its own environment variables -- DB_PASSWORD,
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, and the proxy-net network -- configured directly
# in Portainer's UI, not written by this workflow. The webhook redeploy re-pulls whatever
# image tag the stack is already configured for (docker-compose.yml defaults
# ADVENTURES_API_IMAGE to :latest, which this workflow also pushes).
#
# Required repository secret for the deploy half:
#   PORTAINER_REDEPLOY_WEBHOOK_URL -- the stack's webhook URL from Portainer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          # The Dockerfile's last stage, named explicitly so that adding a stage after it
          # cannot silently change what gets published.
          target: runtime
          push: true
          build-args: |
            ADVENTURES_BUILD_REVISION=${{ github.sha }}
          tags: |
            ghcr.io/the-running-dev/adventures-api:${{ github.sha }}
            ghcr.io/the-running-dev/adventures-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    # Skips cleanly, rather than failing, until the Portainer stack exists.
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      # The redeploy trigger carries no contract surface -- no signature, no error code --
      # beyond a successful HTTP response. Portainer re-pulls the stack's configured image
      # (:latest) and restarts it; there is no read-back here of whether that succeeded.
      - name: Trigger the Portainer stack redeploy
        env:
          REDEPLOY_WEBHOOK_URL: ${{ secrets.PORTAINER_REDEPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$REDEPLOY_WEBHOOK_URL" ]; then
            echo "PORTAINER_REDEPLOY_WEBHOOK_URL is not set -- cannot trigger the redeploy" >&2
            exit 1
          fi
          curl -sf -X POST "$REDEPLOY_WEBHOOK_URL"
