name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Preview first; production requires the main branch
        type: choice
        options: [preview, production]
        default: preview
        required: true

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.FRONTEND_HOST == 'cloudflare'
    runs-on: ubuntu-latest
    environment: cloudflare-pages
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Select deployment branch
        id: target
        env:
          TARGET: ${{ inputs.target || 'production' }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$TARGET" = production ]; then
            test "$SOURCE_REF" = refs/heads/main
            echo 'branch=main' >> "$GITHUB_OUTPUT"
          else
            echo 'branch=migration-preview' >> "$GITHUB_OUTPUT"
          fi
      - run: npm run setup
      - run: npm ci
      - run: npm run test:hosting
      - name: Build deployment artifact
        env:
          VITE_API_URL: https://adventures-api.subzerodev.com
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build:cloudflare
      - name: Deploy
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-cloudflare --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ steps.target.outputs.branch }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify deployed routing, assets and cache headers
        env:
          HOSTING_URL: ${{ steps.deployment.outputs.deployment-url }}
        run: npm run verify:hosting -- "$HOSTING_URL"
