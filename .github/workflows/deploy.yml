name: Deploy

# Builds the frontend and deploys dist/ to GitHub Pages from main through the shared pages
# workflow. Pull requests only build. Skipped entirely once FRONTEND_HOST is `vps`, when
# container.yml serves the frontend instead. public/404.html carries its own client-side
# routing redirect, so the workflow's single-page-app 404 is left off.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  pages:
    if: vars.FRONTEND_HOST != 'vps'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pages.yml@v0
    with:
      node-version: "24"
      submodules: "true"
      setup: setup
      # Repo variables, not secrets -- Supabase's anon key is meant to be public, it ends up
      # embedded in this static bundle either way. Unset resolves to "", and
      # supabaseClient.ts's truthy check treats that the same as unconfigured
      # (OAuthConsent.tsx renders a "not configured" state) rather than crashing the build.
      env: |
        VITE_API_URL=https://adventures-api.subzerodev.com
        VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
