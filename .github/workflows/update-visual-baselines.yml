name: Update visual baselines

# Manual only -- this regenerates the `chromium-linux` visual-regression baselines
# (CLAUDE.md, "Visual Baselines"). It mirrors ci.yml's `ci` job setup exactly, so the
# Chromium build it renders with is the same one that job's `npm run check` compares
# against, then runs the browser suite with `--update` instead of asserting.
#
# It commits the result back to the branch by default. That default is the whole point:
# the previous artifact-only version meant a UI change made on Windows (where the visual
# specs are skipped, so there is no local signal) cost a push, a CI failure, an artifact
# download, a manual copy, and a second push. Committing here collapses that to one click.
#
# Run `npm run baselines:update` locally instead when the change is still uncommitted --
# that regenerates in the same kind of container without a round-trip at all, and keeps
# the baseline commit and the code change together, which is what a reviewer wants to see.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to regenerate on and commit to"
        required: false
        default: main
      commit:
        description: "Commit the regenerated baselines back to that branch"
        type: boolean
        required: false
        default: true

# Needed for the push below. The artifact-only version of this workflow ran with the
# default read-only token.
permissions:
  contents: write

# One at a time per branch: two concurrent runs would race on the same push.
concurrency:
  group: update-visual-baselines-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  update-baselines:
    name: update-baselines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: true
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build engine submodule
        run: npm run setup

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual baselines
        run: npm run test:browser:update

      # Still uploaded even when the step below commits: it is the artifact to look at when
      # the diff turns out to be wrong and the commit has to be reverted.
      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: src/play/browser/__screenshots__/visual-baseline.browser.test.tsx/
          if-no-files-found: error

      # Scoped to the baseline directory by path, never `git add -A` (CLAUDE.md's house
      # conventions) -- `engine/` is a submodule and a broad add here could stage a pin
      # this run has no business moving. An unchanged tree is the good outcome, not a
      # failure: it means the committed baselines already match what CI renders.
      - name: Commit regenerated baselines
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/play/browser/__screenshots__/visual-baseline.browser.test.tsx/
          if git diff --cached --quiet; then
            echo "Baselines already match this branch's rendered output - nothing to commit."
            exit 0
          fi
          git commit -m "Regenerate visual baselines on ${{ inputs.ref }}"
          git push origin HEAD:${{ inputs.ref }}
