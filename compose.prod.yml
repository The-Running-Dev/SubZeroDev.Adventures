# Overrides docker-compose.yml for the VPS: pulls the CI-published image instead of
# building, and fronts the API with Caddy for automatic TLS.
#
#   docker compose -f docker-compose.yml -f compose.prod.yml up -d
#
# GITHUB_CLIENT_ID/SECRET, DB_PASSWORD, and the api.adventures.subzerodev.com DNS record
# are the operator's to provision -- not handled here.
services:
  db:
    ports: []
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  migrate:
    build: !reset null
    image: ghcr.io/the-running-dev/adventures-api:latest
    environment:
      DATABASE_URL: postgres://adventures:${DB_PASSWORD}@db:5432/adventures

  api:
    build: !reset null
    image: ghcr.io/the-running-dev/adventures-api:latest
    ports: []
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://adventures:${DB_PASSWORD}@db:5432/adventures
      NODE_ENV: production
      SITE_URL: https://adventures.subzerodev.com
      API_URL: https://api.adventures.subzerodev.com
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  caddy-data:
  caddy-config:
