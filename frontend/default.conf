# The static frontend runtime (docs/frontend-hosting.md): nginx:alpine serving the Vite
# build, the same release shape SubZeroDev.com uses, rather than adding a second static
# server to the estate. TLS and the public hostname belong to the existing proxy-net
# reverse proxy, not to this file.

# Only a real HTML navigation may reach the application shell. A fetch, a script tag or a
# crawler asking for */* gets a real error for a path that is not a real file, so a missing
# asset is never disguised as a 200 shell.
map $http_accept $accepts_html {
    default       0;
    "~*text/html" 1;
}
map $http_sec_fetch_mode $mode_is_navigate {
    default    0;
    ""         1;
    "navigate" 1;
}
map $http_sec_fetch_dest $dest_is_document {
    default    0;
    ""         1;
    "document" 1;
}
# Namespaces that are always resources, plus any path whose last segment carries a dot.
# An application route must stay dot-free to be routable -- see docs/frontend-hosting.md.
map $uri $is_resource {
    default                                                                       0;
    "~^/(assets|campaigns|icons|fonts|images|api|sw|service-worker|manifest)(/|$)" 1;
    "~\.[^/]+/?$"                                                                 1;
}
map "$is_resource$accepts_html$mode_is_navigate$dest_is_document" $serve_shell {
    default 0;
    "0111"  1;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Static hosting answers reads. Nothing here accepts a request body.
    if ($request_method !~ "^(GET|HEAD)$") {
        return 405;
    }

    # `/` is the shell itself, served as a file rather than reached through the navigation
    # fallback below -- otherwise every client that sends no navigation headers (curl,
    # uptime monitors, link-unfurl bots, `*/*` crawlers) gets a 404 at the canonical origin.
    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-cache always;
        try_files /index.html =404;
    }

    # Vite content hashes make exactly these immutable. Nothing else may claim it.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[^/]+$" {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The deployed commit. Both the healthcheck and deployment verification read it.
    location = /__build-id {
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-cache always;
        try_files $uri @shell;
    }

    location @shell {
        # A bare `return` here hands the response to @notfound below, so the error carries
        # `no-store` rather than this location's `no-cache`.
        if ($serve_shell = 0) {
            return 404;
        }
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-cache always;
        add_header Vary "Accept, Sec-Fetch-Mode, Sec-Fetch-Dest" always;
        try_files /index.html =404;
    }

    error_page 404 @notfound;
    location @notfound {
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        return 404 "Not found\n";
    }

    error_page 405 @notallowed;
    location @notallowed {
        default_type text/plain;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        return 405 "Method not allowed\n";
    }
}
